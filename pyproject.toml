[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gct"
version = "0.2.0-alpha"
description = "GoCarbonTracker: a workspace folder for company documents, kept as an append-only history."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pdfplumber>=0.11", "pypdfium2>=5.9", "openpyxl>=3.1.5", "reportlab>=5.1", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest", "jsonschema>=4.26"]
models = ["transformers>=4.40", "torch>=2.0"]

[project.scripts]
gct = "gct.cli:main"

[tool.setuptools.packages.find]
include = ["gct*"]

[tool.setuptools.package-data]
"gct.workspace" = ["migrations/*.sql"]
# The committed viewer build: a plain folder (no __init__.py), so it needs its own glob.
"gct" = ["viewer_dist/*", "viewer_dist/assets/*"]
# The published JSON Schema of the report dataset (story 7.2), copied into every JSON export.
"gct.reports" = ["*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
